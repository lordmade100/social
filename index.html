<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mxit 2026 // Vynix Node</title>
    <style>
        /* Modern Terminal / Neobrutalist Mxit Theme */
        :root {
            --bg-color: #050505; /* OLED Black */
            --surface-color: #111111;
            --mxit-blue: #2563eb;
            --mxit-cyan: #22d3ee;
            --mxit-red: #ef4444;
            --mxit-green: #4ade80;
            --text-main: #f8fafc;
            --text-dim: #64748b;
            --border-color: #334155;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            /* 100dvh handles modern mobile browser address bars perfectly */
            height: 100dvh; 
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        /* Views System */
        .view {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--bg-color);
        }
        .view.active {
            display: flex;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Status Bar (Top) */
        .status-bar {
            padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
            background-color: var(--mxit-blue);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--mxit-cyan);
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.2);
            z-index: 10;
        }

        .status-left { display: flex; align-items: center; gap: 8px; }
        .ping-dot {
            width: 8px;
            height: 8px;
            background-color: var(--mxit-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--mxit-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Splash Screen */
        .splash-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1e3a8a 0%, var(--bg-color) 70%);
        }
        .splash-title {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--text-main);
            text-shadow: 2px 2px 0px var(--mxit-blue), -2px -2px 0px var(--mxit-cyan);
            margin-bottom: 16px;
        }
        .splash-subtitle {
            font-size: 12px;
            color: var(--mxit-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Main Menu */
        .menu-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            list-style: none;
        }
        .menu-item {
            padding: 16px;
            margin-bottom: 12px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.1s;
        }
        .menu-item:active {
            background-color: var(--mxit-blue);
            border-color: var(--mxit-cyan);
            transform: scale(0.98);
        }
        .menu-num {
            color: var(--mxit-cyan);
            background: rgba(34, 211, 238, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Chat Interface */
        .chat-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .chat-message {
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .msg-meta {
            font-size: 12px;
            color: var(--text-dim);
            margin-right: 6px;
        }
        .msg-user {
            color: var(--mxit-cyan);
            font-weight: bold;
            margin-right: 4px;
            cursor: pointer;
        }
        .msg-user.self { color: var(--mxit-green); }
        .msg-text { color: var(--text-main); }
        .msg-media-tag {
            color: var(--mxit-blue);
            font-size: 12px;
            border: 1px solid var(--mxit-blue);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 4px;
        }

        /* Input Area */
        .chat-input-container {
            display: flex;
            padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            gap: 8px;
        }
        .chat-input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 16px; /* Prevents iOS auto-zoom */
            padding: 12px;
            border-radius: 8px;
            outline: none;
        }
        .chat-input:focus { border-color: var(--mxit-cyan); }
        
        .chat-send-btn {
            background-color: var(--mxit-blue);
            color: white;
            border: none;
            padding: 0 20px;
            font-family: var(--font-mono);
            font-weight: bold;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .chat-send-btn:active { background-color: var(--mxit-cyan); color: #000; }

        /* Scrollbar hides for cleanliness on desktop testing */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); }

        .sys-msg { color: var(--mxit-blue); font-style: italic; font-size: 13px; text-align: center; padding: 10px; }
    </style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="view-splash" class="view active">
    <div class="splash-container">
        <div class="splash-title">MXIT</div>
        <div class="splash-subtitle">2026 // Vynix Node</div>
        <div class="sys-msg" style="margin-top: 40px; color: var(--mxit-cyan);" id="splash-status">Establishing connection...</div>
    </div>
</div>

<!-- MAIN MENU -->
<div id="view-menu" class="view">
    <div class="status-bar">
        <div class="status-left">
            <div class="ping-dot"></div>
            <span>VYNIX_MAINNET</span>
        </div>
        <span id="clock-menu">00:00</span>
    </div>
    
    <ul class="menu-list">
        <li class="menu-item" onclick="openView('view-chat')">
            <span class="menu-num">1</span>
            <span>MultiX Global</span>
        </li>
        <li class="menu-item" onclick="alert('Feature locked in current build.')">
            <span class="menu-num">2</span>
            <span>JoeBugg Games</span>
        </li>
        <li class="menu-item" onclick="alert('Feature locked in current build.')">
            <span class="menu-num">3</span>
            <span>Tradepost</span>
        </li>
        <li class="menu-item" onclick="alert('User ID: ' + (window.currentUser ? window.currentUser.uid : 'Guest'))">
            <span class="menu-num">4</span>
            <span>My Profile</span>
        </li>
    </ul>
</div>

<!-- CHAT ROOM -->
<div id="view-chat" class="view">
    <div class="status-bar">
        <div class="status-left" onclick="openView('view-menu')" style="cursor:pointer; color: var(--mxit-cyan);">
            <span>&lt; BACK</span>
        </div>
        <span>MULTIX</span>
        <span id="clock-chat">00:00</span>
    </div>

    <div class="chat-scroll-area" id="chat-box">
        <div class="sys-msg" id="chat-loader">Decrypting message history...</div>
    </div>

    <div class="chat-input-container">
        <input type="text" id="msg-input" class="chat-input" placeholder="> type here..." autocomplete="off" onkeypress="if(event.key==='Enter')sendMessage()">
        <button class="chat-send-btn" onclick="sendMessage()">TX</button>
    </div>
</div>

<script type="module">
import {
    getDatabase, ref, onChildAdded, push, serverTimestamp, query, limitToLast
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// Database Configuration
const firebaseConfig = {
    apiKey: "AIzaSyBOyZ3As4GTuNvjemvPF_SpsC6m6vqtNhc",
    authDomain: "fire-b-a8878.firebaseapp.com",
    databaseURL: "https://fire-b-a8878.firebaseio.com",
    projectId: "fire-b-a8878",
    storageBucket: "fire-b-a8878.appspot.com",
    messagingSenderId: "658673187627",
    appId: "1:658673187627:web:6e4c29af661785f0afa36e"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

window.currentUser = null;
let chatInitialized = false;

// --- UTILS ---
function updateClock() {
    const d = new Date();
    const time = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    document.getElementById('clock-menu').textContent = time;
    document.getElementById('clock-chat').textContent = time;
}
setInterval(updateClock, 1000);
updateClock();

function escapeHtml(unsafe) {
    return (unsafe || '').toString()
         .replace(/&/g, "&amp;")
         .replace(/</g, "&lt;")
         .replace(/>/g, "&gt;")
         .replace(/"/g, "&quot;")
         .replace(/'/g, "&#039;");
}

// --- VIEW ROUTING ---
window.openView = (viewId) => {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    
    if (viewId === 'view-chat') {
        initChat();
        setTimeout(() => document.getElementById('msg-input').focus(), 100);
    }
};

// --- AUTHENTICATION ---
onAuthStateChanged(auth, (user) => {
    const status = document.getElementById('splash-status');
    
    if (!user) {
        status.textContent = "Auth required. Redirecting...";
        status.style.color = "var(--mxit-red)";
        setTimeout(() => { window.location.href = 'signup.html'; }, 1000);
        return;
    }
    
    window.currentUser = user;
    status.textContent = "Authentication success.";
    status.style.color = "var(--mxit-green)";
    
    setTimeout(() => { openView('view-menu'); }, 800);
});

// --- CHAT LOGIC (Using Vynix 'posts' node) ---
function initChat() {
    if (chatInitialized) return;
    chatInitialized = true;
    
    const chatBox = document.getElementById('chat-box');
    const loader = document.getElementById('chat-loader');
    
    // Limit payload to last 50 for speed
    const chatQuery = query(ref(db, 'posts'), limitToLast(50));
    
    onChildAdded(chatQuery, (snapshot) => {
        if(loader) loader.style.display = 'none';
        
        const post = snapshot.val();
        
        // Extract Data
        const uid = post.uid || 'unknown';
        const isSelf = window.currentUser && uid === window.currentUser.uid;
        const username = post.user?.username || uid.substring(0,6);
        
        // Date formatting
        const d = post.timestamp ? new Date(post.timestamp) : new Date();
        const timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        
        // Content handling (strip heavy media, show tags)
        let textContent = escapeHtml(post.text || '');
        let mediaTag = '';
        if (post.mediaUrl || (post.mediaUrls && post.mediaUrls.length > 0)) {
            const type = post.mediaType === 'video' ? 'VIDEO' : 'IMAGE';
            mediaTag = `<div class="msg-media-tag">[ATTACHMENT: ${type}]</div>`;
            if(!textContent) textContent = '<span style="color:var(--text-dim);font-style:italic;">shared media</span>';
        }

        // Build element
        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-message';
        
        msgDiv.innerHTML = `
            <span class="msg-meta">[${timeStr}]</span>
            <span class="msg-user ${isSelf ? 'self' : ''}">@${escapeHtml(username)}:</span>
            <span class="msg-text">${textContent}</span>
            ${mediaTag}
        `;
        
        chatBox.appendChild(msgDiv);
        
        // Auto-scroll to bottom
        chatBox.scrollTop = chatBox.scrollHeight;
    });
}

// --- SEND MESSAGE ---
window.sendMessage = async () => {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    
    if (!text || !window.currentUser) return;
    
    // Clear input immediately for snappy UX
    input.value = ''; 
    
    try {
        // Push strictly text to the existing Vynix structure
        await push(ref(db, 'posts'), {
            uid: window.currentUser.uid,
            text: text,
            timestamp: serverTimestamp(),
            // Mimic standard Vynix object structure
            user: { 
                username: window.currentUser.email ? window.currentUser.email.split('@')[0] : 'User' 
            }
        });
        
        // Haptic feedback if supported
        if (navigator.vibrate) navigator.vibrate(30);
        
    } catch (e) {
        alert("TX Failed: " + e.message);
    }
}
</script>
</body>
</html>
