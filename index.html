<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vynix</title>
    <style>
        /* Classic J2ME / Feature Phone Styling */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #333;
            font-family: "Courier New", Courier, monospace; /* Retro fixed-width font */
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* The Phone Screen */
        .screen {
            width: 100%;
            max-width: 320px; /* Classic feature phone width */
            height: 100%;
            background-color: #E8E8E8; /* Old LCD grey */
            color: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            border-left: 2px solid #111;
            border-right: 2px solid #111;
        }

        /* Classic Mxit Blue Header */
        .header {
            background-color: #000080;
            color: #FFF;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #000;
        }

        .view {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
        }
        .view.active { display: flex; }

        /* Splash Screen */
        .splash {
            justify-content: center;
            align-items: center;
            background-color: #000080;
            color: white;
            flex: 1;
        }
        .splash h1 { font-size: 32px; letter-spacing: 2px; margin-bottom: 10px; }
        .splash p { font-size: 12px; }

        /* Menu Items */
        .menu-list {
            list-style: none;
            flex: 1;
            overflow-y: auto;
            background: #E8E8E8;
        }
        .menu-item {
            padding: 8px 12px;
            border-bottom: 1px dotted #888;
            font-size: 14px;
            cursor: pointer;
            color: #000080;
            font-weight: bold;
        }
        .menu-item:hover, .menu-item:active {
            background-color: #000080;
            color: #FFF;
        }

        /* Chat Room */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
            background: #FFF;
            font-size: 13px;
        }
        .message {
            margin-bottom: 4px;
            line-height: 1.2;
            word-wrap: break-word;
        }
        .msg-time { color: #888; font-size: 11px; }
        .msg-user { color: #000080; font-weight: bold; }
        .msg-text { color: #000; }

        /* Input Area */
        .input-area {
            display: flex;
            background: #CCC;
            padding: 4px;
            border-top: 1px solid #888;
        }
        .input-area input {
            flex: 1;
            font-family: inherit;
            font-size: 14px;
            padding: 2px 4px;
            border: 1px solid #888;
            border-radius: 0;
            outline: none;
        }
        .input-area button {
            font-family: inherit;
            background: #000080;
            color: white;
            border: 1px solid #000;
            padding: 2px 8px;
            margin-left: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Soft Keys (Bottom bar) */
        .soft-keys {
            display: flex;
            justify-content: space-between;
            background: #000080;
            color: white;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
        }
        .soft-btn { cursor: pointer; }

        .loading { text-align: center; padding: 20px; font-style: italic; font-size: 12px; }
    </style>
</head>
<body>

<div class="screen">

    <!-- SPLASH SCREEN -->
    <div id="view-splash" class="view splash active">
        <h1>VYNIX</h1>
        <p>Connecting...</p>
    </div>

    <!-- MAIN MENU -->
    <div id="view-menu" class="view">
        <div class="header">
            <span>Vynix</span>
            <span id="menu-time">12:00</span>
        </div>
        <ul class="menu-list">
            <li class="menu-item" onclick="openChat()">[1] Global Chat</li>
            <li class="menu-item" onclick="alert('Feature coming soon!')">[2] Contacts</li>
            <li class="menu-item" onclick="alert('Feature coming soon!')">[3] Tradepost</li>
            <li class="menu-item" onclick="alert('Profile ID: ' + (currentUser ? currentUser.uid.substring(0,6) : 'Guest'))">[4] My Profile</li>
            <li class="menu-item" onclick="alert('Vynix v1.0. Ultra-light.')">[5] Info</li>
        </ul>
        <div class="soft-keys">
            <span class="soft-btn">Options</span>
            <span class="soft-btn">Exit</span>
        </div>
    </div>

    <!-- CHAT ROOM -->
    <div id="view-chat" class="view">
        <div class="header">
            <span>MultiX: Global</span>
            <span class="soft-btn" onclick="openMenu()">Back</span>
        </div>
        <div class="chat-container" id="chat-box">
            <div class="loading" id="chat-loading">Loading messages...</div>
        </div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Type msg..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

</div>

<script type="module">
import {
    getDatabase, ref, onChildAdded, push, serverTimestamp, query, limitToLast
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// Your exact Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyBOyZ3As4GTuNvjemvPF_SpsC6m6vqtNhc",
    authDomain: "fire-b-a8878.firebaseapp.com",
    databaseURL: "https://fire-b-a8878.firebaseio.com",
    projectId: "fire-b-a8878",
    storageBucket: "fire-b-a8878.appspot.com",
    messagingSenderId: "658673187627",
    appId: "1:658673187627:web:6e4c29af661785f0afa36e"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

window.currentUser = null;
let chatListenerActive = false;

// Format time like Mxit: HH:MM
function getFormattedTime(timestamp) {
    const d = timestamp ? new Date(timestamp) : new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
}

// Update clock
setInterval(() => {
    const el = document.getElementById('menu-time');
    if(el) el.textContent = getFormattedTime();
}, 10000);

// View Navigation
function switchView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
}

window.openMenu = () => {
    switchView('view-menu');
}

window.openChat = () => {
    switchView('view-chat');
    if (!chatListenerActive) {
        loadChat();
    }
}

// Authentication
onAuthStateChanged(auth, (user) => {
    if (!user) {
        // If not logged in, mock a basic sign in or redirect
        window.location.href = 'signup.html';
        return;
    }
    window.currentUser = user;
    
    // Simulate connection delay for nostalgia
    setTimeout(() => {
        switchView('view-menu');
    }, 1500);
});

// Load Chat (Vynix Posts rendered as text messages)
function loadChat() {
    chatListenerActive = true;
    const chatBox = document.getElementById('chat-box');
    const loading = document.getElementById('chat-loading');
    
    // Listen to the last 30 posts
    const chatQuery = query(ref(db, 'posts'), limitToLast(30));
    
    onChildAdded(chatQuery, (snapshot) => {
        if(loading) loading.style.display = 'none';
        
        const post = snapshot.val();
        // Since we are reading from the 'posts' node you already have, 
        // we'll format it like a Mxit chat message.
        
        // Handle missing data gracefully
        const username = post.user?.username || (post.uid ? post.uid.substring(0,5) : 'Guest');
        const time = getFormattedTime(post.timestamp);
        const text = post.text || (post.mediaUrl ? '[Image Attachment]' : '[Empty]');
        
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message';
        
        // Only show text, strip out HTML or complex media
        msgDiv.innerHTML = `
            <span class="msg-time">[${time}]</span> 
            <span class="msg-user">*${escapeHtml(username)}*:</span> 
            <span class="msg-text">${escapeHtml(text)}</span>
        `;
        
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to bottom
    });
}

// Send Message
window.sendMessage = async () => {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !window.currentUser) return;
    
    input.value = ''; // clear input immediately
    input.focus();

    try {
        // Pushing to your existing 'posts' node to keep data consistent
        await push(ref(db, 'posts'), {
            uid: window.currentUser.uid,
            text: text,
            timestamp: serverTimestamp(),
            // Mocking a basic user object so it shows up correctly
            user: { username: window.currentUser.email.split('@')[0] } 
        });
    } catch (e) {
        alert("Failed to send: " + e.message);
    }
}

// Simple HTML escape to prevent XSS
function escapeHtml(unsafe) {
    return (unsafe || '').toString()
         .replace(/&/g, "&amp;")
         .replace(/</g, "&lt;")
         .replace(/>/g, "&gt;")
         .replace(/"/g, "&quot;")
         .replace(/'/g, "&#039;");
}
</script>
</body>
</html>
